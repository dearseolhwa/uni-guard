<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="UniGuard · Unified Disaster Risk Reduction and Management System for the Municipality of Lingayen, Pangasinan LGU and MDRRMO coordination.">
<meta name="theme-color" content="#0E2243">
<meta name="color-scheme" content="light">
<title>UniGuard · Unified DRRM System · Lingayen</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons-192.png">
<link rel="apple-touch-icon" href="icons-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UniGuard">

<!-- Base reset first, then tokens, fonts, the approved stylesheet, screen additions -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/screens-additions.css">
<link rel="stylesheet" href="css/dispatch.css">
<!-- Oct 2026 design: light, one palette per role. Remove these three lines to
     return to the previous dark design. Plus Jakarta Sans comes from Google
     Fonts like the React app; offline, phones use their own system font.
     To make it work offline too, see docs/DESIGN_2026.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/design.css">
<!-- Super Admin home screen (copied from the React app); every rule is scoped under .ug-sa -->
<link rel="stylesheet" href="css/superadmin.css">
</head>
<body>

<!-- connectivity / sync strip, driven by js/app.js -->
<div id="ug-conn" class="ug-banner-strip" hidden></div>

<!-- application root -->
<div id="ug-root" class="ug-root"></div>

<!-- toast host -->
<div id="ug-toasts" class="ug-toast-host" aria-live="polite" aria-atomic="false"></div>

<!--
  Preview bar. Hidden unless UG_CONFIG.DEV is true, which it is not in
  production. It only carries a connectivity simulation, a state reset and a
  sign out. There are no demo accounts and no role switcher.
-->
<div id="ug-demo" class="ug-demo ug-hidden">
  <span class="d-lab"><i></i>Preview mode</span>
  <button data-off="1">Offline: off</button>
  <button data-reset="1">Restart</button>
</div>

<noscript>
  <div style="padding:28px;font-family:system-ui;color:#E8EFFA;background:#050910;min-height:100vh">
    <h1 style="font-size:20px;margin:0 0 8px">UniGuard needs JavaScript</h1>
    <p style="color:#A3B6D0;font-size:13px;line-height:1.6;max-width:52ch">
      This is the disaster reporting and coordination application. Enable JavaScript
      to sign in. In an emergency, call your barangay desk or the Municipal DRRMO directly.
    </p>
  </div>
</noscript>

<!--
  Load order matters: config and utilities first, then the render layer, then the
  services, then the controller. All classic scripts share one global lexical
  scope, which is how the modules see each other without a bundler.
-->
<script src="vendor/supabase.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="env.js"></script>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<!-- Shared export layer: metadata, filenames, dates, CSV, scope checks (export-core),
     the formal PDF template (pdf) and the formatted Excel writer (xlsx-lite) -->
<script src="js/export-core.js"></script>
<script src="js/pdf.js"></script>
<script src="js/xlsx-lite.js"></script>

<!-- Where UniGuard is deployed (Lingayen, Pangasinan) and its one colour scheme.
     Both are read by the render layer, the map and the data repository below. -->
<script src="js/geo.js"></script>
<script src="js/theme.js"></script>
<script src="js/hazard-types.js"></script>
<!-- per-hazard alarm sounds, used by the alert overlay, the queues and the dispatch portal -->
<script src="js/alarm.js"></script>

<script src="js/screens.js"></script>
<script src="js/screens.web.js"></script>
<script src="js/screens.auth.js"></script>
<script src="js/screens.admin.js"></script>
<!-- Super Admin home screen: Overview, Accounts, Activity (route admin-home) -->
<script src="js/screens.superadmin.js"></script>

<!-- feature modules: render functions + data shape, loaded before repo so they
     can seed UG.DATA defaults that the repo overwrites when Supabase is reachable. -->
<script src="js/relief.js"></script>
<script src="js/settings.js"></script>
<script src="js/guides.js"></script>
<script src="js/faqs.js"></script>
<script src="js/roadwork.js"></script>
<script src="js/sos.js"></script>
<script src="js/notifications-store.js"></script>
<script src="js/urgent-alerts.js"></script>
<script src="js/dispatch.js"></script>
<!-- Module G: situation report, incident summary, damage and needs assessment -->
<script src="js/reporting.js"></script>
<!-- Module export definitions (hotlines, analytics, admin, relief, guides, dispatch) -->
<script src="js/exports.js"></script>

<script src="js/repo.js"></script>
<script src="js/auth.js"></script>
<script src="js/map.js"></script>
<script src="js/features.js"></script>
<script src="js/pwa.js"></script>
<script src="js/app.js"></script>
</body>
</html>
